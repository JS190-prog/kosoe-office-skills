# 서식 채우기형 한글 스킬의 양식 정의 — 코쇠오피스 앱과 사람이 함께 읽는다.
# 서식(.hwp)에 든 칸 토큰({{이름}})과 화면에 보일 이름·묶음·기본값을 잇는다. 조항 문장은 서식에 들어 있어 여기에 적지 않는다.
id: pb-addon-contract
name: PB 전산서비스 추가업무 이용 계약서
kind: hwp-fill
purpose: 기본계약(PowerBase 전산서비스 이용계약)을 맺은 고객사가 추가 업무를 이용할 때 맺는 부속 계약서
owner: 금융영업본부
grade: c                                  # 대외비 — 고객사·금액이 들어간다
template: templates/pb_addon_contract.hwp
jar: scripts/koscom-hwp-fill.jar
title: PowerBase 전산서비스 추가 업무 이용 계약서 ({추가업무명})

sections:
  - heading: 계약 당사자
    fields:
      - {key: 고객사명, label: 고객사명, required: true, example: E증권 주식회사, hint: '"갑". 법인 형태(주식회사)까지 적는다'}
      - {key: 갑주소, label: 갑 주소, example: 서울특별시 영등포구 ○○로 1}
      - {key: 갑대표이사, label: 갑 대표이사, example: 홍 길 동, hint: 서명란에 인쇄된다. 원본 서식처럼 글자 사이를 띄운다}
      - {key: 을대표이사, label: 을 대표이사, example: 김 철 수, hint: 코스콤 대표이사. 글자 사이를 띄운다}
  - heading: 계약 내용
    fields:
      - {key: 추가업무명, label: 추가 업무명, required: true, example: 고객확인 모니터링 고도화, hint: 표지 부제와 제2조에 들어간다}
      - {key: 기본계약체결일, label: 기본계약 체결일, required: true, example: 2019.03.15, date: Y.MM.DD, pattern: '^\d{4}\.\d{2}\.\d{2}$', hint: YYYY.MM.DD}
      - {key: 계약기간, label: 계약기간, default: 추가업무 가동 이후 1년간}
      - {key: 계약일, label: 계약 체결일, default: '{year}.    .    .', hint: 정해지지 않았으면 그대로 둔다(연도만 인쇄하고 월·일은 손으로 적는다)}
  - heading: 서비스 이용료
    table:
      key: 이용료
      unit: 천원/년, 부가세 별도
      cols: [대분류, 중분류, 소분류, 회사기본, 영업점당, 이용량, 비고]
      required: [소분류, 회사기본]
      blank: {영업점당: '-', 이용량: '-'}      # 값이 없을 때 넣는 글
      sum: {col: 회사기본, into: 합계}         # 이 열의 합을 {{합계}} 칸에 넣는다

# 서식에 들어 있어 바꾸지 않는 것(바꾸려면 서식을 고쳐 새 버전으로 올린다)
fixed:
  - 표지 제목 · 본문 제목
  - 제1조 목적 · 제2조 서비스의 내용 · 제3조 서비스 이용료 · 제4조 계약기간 · 제5조 기타사항의 조항 문장
  - 을(주식회사 코스콤)의 상호와 주소
