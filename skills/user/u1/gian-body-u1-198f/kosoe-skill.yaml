id: gian-body-u1-198f
name: 기안문 팩
scope: user
owner: u1
version: 1.3.0
grade: i
extends:
- corp:koscom-hwp-report
forms:
- id: main
  name: 기안문
  fmt: hwp
  use: 결재
  preset: draft
  desc: 기안문 작성사례에 맞춘 양식 — 수신자 · 제목, 관련 근거, 「아래」 번호 항목, 첨부 목록
  outline:
  - 관련 근거
  - 추진 개요
  - 추진 내용
  - 예산 현황
  - 기타 사항
rules:
- "제목은 「(사업명 · 행사명) 추진 및 계약 체결 의뢰」 꼴로 쓰고, 계약 없이 예산만 집행하면 「… 추진 및 집행 의뢰」로 쓴다(예 - 코스콤 대학생 아이디어 페스티벌 추진 및 계약 체결 의뢰). purpose는 요청 문장 「아래와 같이 ○○을 추진하고자 하오니 결재하여 주시기 바랍니다」의 ○○이라 사업명 · 행사명만 쓰고 「개최」 · 「추진」 · 「시행」 · 「실시」 같은 동작 말을 붙이지 않는다(예 - 대학생 아이디어 페스티벌, 원장 클라우드 고객 세미나)."
- recipient는 이 기안으로 일을 맡기는 부서의 장이다. 작성사례처럼 계약 체결 · 구매 · 예산 집행(행사 다과 · 기념품 구입 포함)을 의뢰하면 「경영지원부장」으로 쓴다. 「내부결재」는 다른 부서에 맡길 일 없이 부서 안 결재로 끝나는 기안(내부 계획 · 결과 보고)에만 쓴다.
- "관련 근거 장에는 근거 문서를 한 항목에 하나씩 '부서연도-번호(YYYY. M. D. : 문서명)' 꼴로 쓰고(예 - 기획2026-123(2026. 6. 30. : 문서명)), 근거 문서가 없으면 그 장의 항목을 비운다."
- "추진 개요에는 배경 · 사업명(행사명) · 주제(목적) · 대상을 항목으로 쓰고, 일시 · 장소 · 기간이 있으면 대상 다음에 「일시」 · 「장소」(둘 다 짧으면 「일시 · 장소」) 라벨의 ㅇ 항목으로 따로 쓴다. 일시 · 장소를 다른 항목의 하위 항목(-)으로 넣지 않는다. 추진 내용에는 진행 단계와 기준 · 내역을 한 항목씩 나란히 쓴다(예 - 예선 심사 : …, 본선 심사 : …, 심사 기준 : …, 시상 내역 : …). 행사 순서처럼 짧은 단계가 이어지면 「진행 순서」 한 항목에 쉼표로 묶는다(예 - 진행 순서 : 서비스 소개(20분), 전환 사례 발표(20분), 질의응답(20분)). 추진 개요 · 추진 내용의 ㅇ 항목은 모두 무엇에 대한 항목인지 드러나는 2~6자 라벨을 붙여 「ㅇ 라벨 : 내용」으로 쓰고, 라벨의 말을 내용 첫머리에서 되풀이하지 않는다."
- "하위 항목(-)은 상위 항목에 없는 세부만 「세부 이름 : 내용」 꼴로 덧붙인다(「구분」이라는 말을 라벨로 쓰지 않는다)(예 - 시상 내역 : 본선 진출자 대상 소정의 기념품 제공 아래 「상장 및 수료증 : …」). 상위 항목과 같은 말을 되풀이하지 않는다."
- "예산 현황 장은 장 제목 줄(text)에 예산 배정 구분을 쓰고(예 - 소요 예산 신규 배정(계정과목 : 광고선전비)), 항목 없이 표(배정부서 · 계정과목 · 예산적요 · 금액)와 표 단위 「(단위 : 원, 부가세 별도)」를 쓴다. 표 금액은 원 단위 숫자에 쉼표를 찍는다. 배정 구분을 모르면 「소요 예산(계정과목 : (확인 필요))」처럼 구분 말 없이 쓴다. 예산 금액 · 내역은 이 표에만 쓰고 추진 내용에 되풀이하지 않는다."
- "기타 사항: 기본계획과 집행을 한 번에 품의하면 라벨 없이 「효율적인 업무 처리를 위해 기본계획과 집행품의를 단일 건으로 처리」 항목을 쓰고 그 아래에 각주 「* 관련 근거 : 「직제규정세칙」 제7조제1항제3호」를 단다. 관련 근거 장에는 넣지 않는다."
- "attachments에는 근거 문서 · 추진 방안 · 견적서 · 참고 자료를 「문서명 1부」 꼴로 쓰고, 근거 공문은 「[문서번호] 문서명 (YYYY. M. D.) 1부」로 쓴다. 첨부 순서는 근거 문서 → 추진 방안 → 견적서 → 참고 자료."
- "문체 — 줄 끝에 마침표를 찍지 않고 명사형으로 맺는다(「~ 필요」 · 「~ 제공」 · 「~ 처리」 · 「~ 예정」 · 「~ 체결」 · 「~ 통보」)."
- "문체 — 한 항목은 보통 20~50자로 한 줄 안팎에 쓴다. 대상 · 수치 · 시기처럼 이어지는 내용은 쪼개지 말고 괄호에 묶어 앞말에 붙여 쓴다(예 - 학회(총 9개 팀, 약 50명 참여 예정), 서류 평가(실무진 총 10명))."
- "문체 — 나열은 쉼표로 묶어 한 항목에 쓴다(예 - 실현 가능성, 자료 구체성, 창의성)."
- "문체 — 본문에서 큰 금액은 '억원' · '천만원'으로 쓰고 근거 문서의 금액을 다른 단위로 바꾸지 않는다(예산 표 금액은 원 단위)."
