id: gian-body-u1-198f
name: 기안문 팩
scope: user
owner: u1
version: 1.1.0
grade: i
extends:
- corp:koscom-hwp-report
forms:
- id: main
  name: 기안문
  fmt: hwp
  use: 결재
  preset: draft
  desc: 대표 문서 5건으로 만든 기안문 양식 — 관련 근거와 「아래」 번호 항목 본문
  outline:
  - 관련 근거
  - 추진 개요
  - 추진 내용·방안
  - 세부 내역
  - 계약·도입 방법 또는 향후 추진 사항
  - 추진 일정
  - 예산 현황
  - 협조 요청 사항
  - 기타 사항
  style:
    ending: noun
    date: Y.MM.DD
    max_len: 90
rules:
- 제목은 추진하는 일 그 자체로 쓴다(예 - 본사 회의실 화상회의 장비 교체). 「아래와 같이 ○○을 추진하고자 하오니 결재하여 주시기 바랍니다」 문장은 제목에서 만들어진다.
- "관련 근거 장에는 근거 문서를 한 항목에 하나씩 '부서연도-번호(시행일 : 문서명)' 형식으로 쓰고, 근거 문서가 없으면 그 장의 항목을 비운다."
- 항목은 ㅇ, -, * 기호로 단계별 개조식으로 쓴다.
- "금액표에는 단위와 부가세 포함·별도 여부를 표 위에 적는다(예 - 단위 : 천원, 부가세 별도)."
- 기본계획과 집행을 통합하여 품의할 때는 기타 사항에 그 사실과 근거(「직제규정세칙」 제7조제1항제3호)를 적는다. 관련 근거 장에는 넣지 않는다.
- "문체 — 줄 끝에 마침표를 찍지 않는다(대표 문서에서 마침표로 끝난 줄 1%)."
- "문체 — 한 항목은 보통 22~45자(평균 37자)로 쓴다. 대상 · 수치 · 시기처럼 이어지는 내용은 짧게 쪼개지 말고 한 항목에 묶고, 45자를 넘으면 - 하위 항목으로 나눈다."
- "문체 — 항목 앞 라벨은 거의 쓰지 않는다(라벨 붙은 줄 10%). 「ㅇ 내용」처럼 바로 쓰고 라벨은 빈 문자열로 둔다."
- "문체 — 줄 끝은 「통보」 · 「체결」 · 「활용」 · 「참조」 · 「마련」 · 「확보」처럼 명사로 맺는 꼴을 우선 쓴다."
- "문체 — 「위 근거에 의거」 · 「다음과 같이」 · 「향후 추진 사항」 · 「계약 체결」처럼 기안문에서 굳어진 표현을 쓴다."
- "문체 — 본문 금액은 '억원' · '천만원'처럼 큰 단위로 쓰고 근거 문서의 금액을 다른 단위로 바꾸지 않는다(표 금액은 표 위 단위 표기를 따른다)."
- "문체 — 쉼표로 길게 잇지 않는다(쉼표 줄당 0.25개). 보충 설명(기간 · 근거 문서 · 단위)은 괄호로 단다."
