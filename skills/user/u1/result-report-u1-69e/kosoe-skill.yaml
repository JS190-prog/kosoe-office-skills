id: result-report-u1-69e
name: 우선협상 결과보고 및 계약체결 팩
scope: user
owner: u1
version: 2.0.0
grade: i
extends:
- corp:koscom-hwp-report
forms:
- id: main
  name: 우선협상 결과보고 및 계약체결
  fmt: hwp
  use: 결재
  preset: draft
  desc: 제한경쟁입찰(협상에 의한 계약)의 우선협상 결과보고 및 계약체결 기안문 — 관련근거(추진 · 입찰 실시 · BMT · 제안평가 · 협상결과 통보), 입찰진행 · 입찰결과 표, 사업발의부서 협상결과, 계약 조건 · 계약내역 · 검사자 표, 첨부 목록
  outline:
  - 관련 근거
  - 입찰진행
  - 입찰결과
  - 사업발의부서 협상결과
  - 계약체결
rules:
- "이 문서는 제한경쟁입찰(협상에 의한 계약)에서 사업발의부서가 우선협상대상자와 협상을 마친 뒤 계약담당부서가 협상 결과를 보고하고 계약 체결을 결재받는 내부결재 기안이다. recipient는 「내부결재」. title은 입찰 실시 문서 제목의 사업명 · 품목 · 입찰건명으로 「(사업명) [품목n]- (입찰건명) 제한경쟁입찰(협상에의한계약) 우선협상 결과보고 및 계약체결」 꼴로 쓴다(예 - ○○ 시스템 고도화 추진 [품목2]- △△ 솔루션 도입 제한경쟁입찰(협상에의한계약) 우선협상 결과보고 및 계약체결). 품목 구분이 없으면 「[품목n]- 」을 뺀다. purpose는 「(입찰건명) 제한경쟁입찰(협상에 의한 계약) 우선협상 결과보고 및 계약체결」, request는 「위 근거에 의거, (purpose)을 아래와 같이 진행하고자 합니다.」로 쓴다(예 - 위 근거에 의거, △△ 솔루션 도입 제한경쟁입찰(협상에 의한 계약) 우선협상 결과보고 및 계약체결을 아래와 같이 진행하고자 합니다.)."
- "관련 근거 장에는 이 입찰이 진행된 순서(시행일 순)대로 근거 문서를 한 항목씩 쓴다: 사업 추진 문서 → 입찰 실시 문서 → BMT 결과 통보 → 제안평가 결과 보고 → 제안평가 결과 통보 및 협상절차 진행 요청 → 협상결과 통보 메일. 문서번호가 있으면 '문서번호(시행일 : 문서 제목)'(예 - 운영2026-0000(2026. 8. 18. : ○○ 시스템 고도화 추진 [품목2]-△△ 솔루션 도입 제한경쟁입찰 실시)), 문서번호가 없는 보고는 '문서 제목(시행일)'(예 - △△ 솔루션 도입 제한경쟁입찰(협상에 의한 계약) 제안평가 결과 보고(2026. 9. 10.)), 협상결과 메일은 '[사내메일] 메일 제목 (받은 날)'(예 - [사내메일] 우선협상결과통보_(사업발의부서)(△△ 솔루션 도입) (2026. 9. 16.))로 쓴다. 업로드한 문서는 그 문서의 시행 칸(「시행  부서2026-0000  (2026. 9. 10.)」)에서 문서번호 · 시행일을, 제목 칸에서 문서 제목을 가져오고, 시행 칸이 비었으면 그 문서를 인용한 다른 문서의 관련 근거 줄 그대로 쓴다. 업로드한 문서가 관련 근거로 인용한 문서(예 - 제안평가 결과 보고)도 넣는다. 문서 제목은 고치지 않고 옮긴다(같은 말이 두 번 나와도 그대로). 요청 · 자료에 없는 문서와 메일은 지어내지 않는다."
- "입찰진행 장은 항목 없이 표 하나로 쓴다(unit 없음). cols는 「일정, 일시, 참가업체, 비 고」, 행은 「제안요청설명회 · 입찰참가등록마감 · 제안발표회(평가) · 협상대상자 선정 · 협상결과 통보」 순서다. 일시는 날짜만 'YYYY. M. D.'로 쓴다: 제안요청설명회 · 입찰참가등록마감은 입찰 실시 문서의 입찰일정, 제안발표회(평가) · 협상대상자 선정은 제안평가 결과 보고의 날짜, 협상결과 통보는 협상결과 메일의 날짜(모르면 「(확인 필요)」). 참가업체는 제안평가에 참여한 업체로 앞의 세 행은 「(우선협상대상자) 외 n개사」, 협상대상자 선정 행은 우선협상대상자, 협상결과 통보 행은 빈칸이다. 비 고는 협상결과 통보 행에만 「협상내용 확정」(협상 내용이 없었으면 「제안서 내용 조정 없음」)을 쓴다."
- "입찰결과 장은 항목 없이 표 하나로 쓰고 unit은 「(단위 : 원, 부가세 별도)」다. cols는 「낙찰업체, 사업예산, 제안금액, 예산대비율」, 행 하나에 우선협상대상자, 입찰 실시 문서의 사업예산(입찰내역 표의 부가세 별도 금액), 협상대상자의 제안(입찰)금액(부가세 별도), 예산대비율(제안금액 ÷ 사업예산 × 100, 소수 둘째 자리까지 반올림 — 예 - 45,000,000 ÷ 90,000,000 → 50.00%)을 쓴다. 금액은 원 단위 숫자에 쉼표."
- "사업발의부서 협상결과 장은 두 항목이다: 「협상결과 통보일 : (메일 받은 날)(사내 메일)」(예 - 협상결과 통보일 : 2026. 9. 16.(사내 메일)), 「협상결과 : 협상대상자인 '(우선협상대상자)'이 첨부와 같이 협상조건을 전부 수용함에 따라 최종 낙찰자(계약상대자)로 선정(첨부 협상결과 참조)」. 협상 결과가 이와 다르면(일부 조정 · 결렬 등) 요청 · 자료의 내용대로 쓰고, 통보일을 모르면 「(확인 필요)」로 둔다."
- "계약체결 장은 이 순서의 항목으로 쓴다: 계약명((입찰건명) 계약) → 「계약내역(상세내역은 첨부 산출내역서(견적서) 참조)」와 그 항목의 table → 계약금액 → 계약보증금 → 계약처 → 납품기한 → 지체상금 → 하자보증기간 및 무상보증기간 → 하자보증금 → 대금지급 → 「검사자(내부감사부 입회)」와 그 항목의 table, 하위 항목 「※ 인사이동 및 조직변경 등으로 인한 검사자 변경 시 후임자가 승계」 → 계정과목. 계약내역 표는 입찰 실시 문서의 입찰내역 표를 그대로 옮기되(cols 「품목, <, 내역, 수량, 사업예산」, 같은 품목은 「^」로 세로 병합) 금액 칸에는 제안금액(부가세 별도)을 쓰고, 금액이 품목 전체에 하나면 둘째 행부터 「^」로 둔다. unit은 「(단위 : 원, 부가세 별도)」. 검사자 표는 사업 추진 문서의 검사자 표를 cols 「부서, 직책자, 담당자」로 옮기되 다른 품목 전용 행(예 - ○○부 (품목(1) …))만 빼고 공통 부서 행(사업 주관 부서, 자산 관리 부서 등)은 모두 둔다. 남은 행의 부서 이름 뒤 품목 표시 괄호는 뺀다(예 - ○○부 (품목(2) △△) → ○○부). 이 장의 다른 표는 넣지 않는다."
- "계약체결의 값: 계약금액은 제안금액(부가세 별도) × 1.1을 원 단위로 반올림해 「(금액)원(부가세 포함)」으로 쓴다(예 - 제안금액 50,000,000 → 55,000,000원(부가세 포함)). 계약보증금은 계약금액의 10/100으로 「5,500,000원(계약금액의 10/100, 지급각서 대체징구(당사 협력업체))」, 하자보증금은 계약금액의 3/100으로 「1,650,000원(계약금액의 3/100, 지급각서 대체징구(당사 협력업체))」 꼴. 계약처는 우선협상대상자. 납품기한 · 하자보증기간 및 무상보증기간 · 대금지급은 사업 추진 문서(또는 제안요청서)의 계약 조건에서 이 품목의 것을 쓴다(예 - 계약 체결일로부터 12주 이내(단, 장비 등 물품납품 기한은 계약 체결일로부터 8주 이내), 검사 완료일로부터 1년, 검사 완료 후 업체 청구일로부터 10일 이내 현금지급). 지체상금은 늘 「지체일수 1일당 계약금액의 1.5/1000」. 계정과목은 사업 추진 문서의 예산 현황 표에서 이 품목 행의 계정과목을 쉼표로 묶는다(예 - 기계장치, 기타의무형자산)."
- "사업발의부서 협상결과 · 계약체결 장의 항목은 label을 비우고 text에 「항목 이름 : 내용」을 통째로 쓴다(예 - 하자보증기간 및 무상보증기간 : 검사 완료일로부터 1년). 항목 이름이 2~6자 라벨 칸보다 길고, 이 양식의 이름을 줄이지 않기 때문이다."
- "attachments는 이 순서로 쓴다: 관련 근거 문서(근거 순서대로, 문서번호가 있으면 「[문서번호] 문서 제목 (YYYY. M. D.) 1부」) → 협상결과 메일 「[사내메일] 메일 제목 (YYYY. M. D.) 1부」 → 「우선협상결과 보고서_(사업발의부서)((입찰건명)) (YYYY. M. D.) 1부」 → 「물품구매계약서_(업체)((계약명)) 1부」 → 「견적서_(업체)((입찰건명)) 1부」 → 「제조사의 물품공급 및 기술지원 확약서_(업체) 1부」 — (업체)는 계약처 이름에서 ㈜를 뺀 것이다. 문서번호가 없는 제안평가 결과 보고는 「제안평가결과 및 입찰진행서류((입찰건명) 제한경쟁입찰(협상에 의한 계약)) (YYYY. M. D.) 1부」로 쓴다. 업로드한 파일은 하나도 빼지 않고, 근거 문서의 첨부 목록에 같은 문서가 이미 「[문서번호] …」로 적혀 있으면 그 표기를 그대로 쓴다. 날짜를 모르는 문서는 날짜 없이 쓴다."
- "문체 — 날짜는 'YYYY. M. D.'(예 - 2026. 9. 16.), 금액은 원 단위 숫자에 쉼표, 회사 이름의 「주식회사」는 「㈜」로 쓴다. 줄 끝에 마침표를 찍지 않고 명사형으로 맺는다(「~ 선정」 · 「~ 지급」 · 「~ 승계」)."
