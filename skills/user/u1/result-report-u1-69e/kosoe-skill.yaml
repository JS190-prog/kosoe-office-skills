blocks:
- heading: 내부결재 머리말
  id: b1
  text: '수신자 :

    내부결재

    제  목 :

    [사업명] [품목명]- [입찰건명] 제한경쟁입찰(협상에의한계약) 우선협상 결과보고 및 계약체결'
- heading: 2. 진행 취지 및 '다음' 안내
  id: b2
  text: '2. 위 근거에 의거, [입찰건명] 제한경쟁입찰(협상에 의한 계약) 우선협상 결과보고 및 계약체결을 다음과 같이 진행하고자 합니다

    - 다         음 -'
- heading: 1. 입찰진행
  id: b3
  text: '1. 입찰진행

    일정

    일시

    참가업체

    비 고

    제안요청설명회

    입찰참가등록마감

    제안발표회(평가)

    협상대상자 선정

    협상결과 통보'
- heading: 2. 입찰결과
  id: b4
  text: '2. 입찰결과                               (단위:원,부가세별도)

    낙찰업체

    사업예산

    제안금액

    예산대비율'
- heading: 3. 사업발의부서 협상결과
  id: b5
  text: '3. 사업발의부서 협상결과

    ㅇ 협상결과 통보일 : [협상결과 통보일] (사내 메일)

    ㅇ 협상결과 : 협상대상자인 ''[협상대상자명]''이 첨부와 같이 협상조건을 전부 수용함에 따라 최종 낙찰자(계약상대자)로 선정(첨부 협상결과 참조)'
- heading: 4. 계약체결
  id: b6
  text: '4. 계약체결

    ㅇ 계약명 : [계약명]

    ㅇ 계약내역(상세내역은 첨부 산출내역서(견적서) 참조)            (단위:원,부가세별도)

    품목

    내역

    수량

    사업예산

    ㅇ 계약금액 : [계약금액](부가세 포함)

    ㅇ 계약보증금 : [계약보증금](계약금액의 10/100, 지급각서 대체징구(당사 협력업체))

    ㅇ 계약처 : [계약처명]

    ㅇ 납품기한 : 계약 체결일로부터 [납품기한]

    (단, 장비 등 물품납품 기한은 계약 체결일로부터 [물품납품기한])

    ㅇ 지체상금 : 지체일수 1일당 계약금액의 1.5/1000

    ㅇ 하자보증기간 및 무상보증기간 : 검사 완료일로부터 [하자보증기간]

    ㅇ 하자보증금 : [하자보증금](계약금액의 3/100, 지급각서 대체징구(당사 협력업체))

    ㅇ 대금지급 : 검사 완료 후 업체 청구일로부터 10일 이내 현금지급

    ㅇ 검사자(감사부 입회)

    부서

    직책자

    담당자

    ※ 인사이동 및 조직변경 등으로 인한 검사자 변경 시 후임자가 승계

    ㅇ 계정과목 : [계정과목]'
- heading: 결재란
  id: b7
  text: '결 재

    부서원

    팀장

    부서장

    협 조

    감사부서장

    감사

    일상감사

    제

    호

    시행

    접수

    공개'
