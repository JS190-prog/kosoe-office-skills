rules:
- 장 순서는 회사 소개 → 고객 과제 → 서비스 제안 → 레퍼런스 → 일정·비용으로 유지한다
- 본문은 'ㅇ (항목) 내용' 형식의 개조식으로 쓰고 문장은 '~임' 등 명사형으로 끝낸다
- 레퍼런스 사례와 실적 수치는 가상·예시 표기를 유지한다
- 비용 단위는 백만원으로 통일하고 기간은 개월로 표기한다
- 일정·비용 표의 합계 기간은 착수일 옆 총 기간과 일치해야 한다
- 유의 문구와 유효기간 문구는 일정·비용 장 끝에 빠짐없이 넣는다
