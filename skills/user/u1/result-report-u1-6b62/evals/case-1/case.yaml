expect:
  outline:
  - 제1조 목적
  - 제2조 서비스의 내용
  - 제3조 서비스 이용료
  - 제4조 계약기간
  - 제5조 기타사항
  - 계약 체결 확인 문구 및 기명날인
  fixed:
  - '"갑"과 "을"은 체결한 전산서비스 이용계약(이하 "기본계약")의 부속 계약으로서, "갑"이 "을"의 전산서비스의 추가 업무를 이용하는 데
    필요한 사항을 정하기 위하여 이 계약을 체결한다.'
  - 이 계약에 따라 "갑"이 이용하는 추가 업무는 [추가 업무명]으로 한다.
  - '이 계약에 따라 "갑"은 추가 업무 이용료로 다음의 금액을 "을"에게 지급한다. (단위 : 천원/년, 부가세 별도)'
  - '① 계약기간은 추가 업무 가동일부터 1년으로 한다.

    ② 이 계약은 기본계약이 존속하는 동안 효력을 가진다. 계약기간이 끝나기 2개월 전까지 어느 한쪽이 서면으로 다른 뜻을 알리지 않으면 이 계약은
    같은 조건으로 1년씩 연장된다.'
  - '① "갑"은 "을"에게 서면으로 해지 의사를 알림으로써 이 계약을 해지할 수 있다. 이 경우 해지의 효력은 "을"이 통지서를 받은 날부터
    1개월이 지난 때에 생긴다.

    ② 계약기간이 끝나기 전에 "갑"의 사정으로 이 계약을 해지하는 경우 "갑"은 남은 계약기간의 이용료를 "을"에게 지급한다.

    ③ 이 계약에서 정하지 않은 사항은 기본계약을 따른다.'
  - 이 계약의 체결을 증명하기 위하여 계약서 2부를 작성하고 "갑"과 "을"이 기명날인한 다음 각각 1부씩 보관한다.
