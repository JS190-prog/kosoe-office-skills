rules:
- 부속 계약이므로 기본계약의 체결일을 반드시 특정하고, 미규정 사항은 기본계약을 따른다고 명시한다.
- 당사자는 "갑"(이용사)과 "을"(제공사)로 약칭하며 처음 등장할 때 정의한다.
- 이용료 단위는 천원/년, 부가세 별도로 표기하고 업무별 금액과 합계를 함께 적는다.
- 계약기간은 추가 업무 가동일부터 1년이며, 기본계약 존속 기간 안에서만 유효하고 만료 2개월 전까지 서면 이의가 없으면 1년씩 자동 연장한다.
- 해지는 서면 통지로 하며 효력은 상대방이 통지서를 받은 날부터 1개월 후 발생한다.
- 갑의 사정으로 중도 해지하면 잔여 계약기간의 이용료를 지급한다.
