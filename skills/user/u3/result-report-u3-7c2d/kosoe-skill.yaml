blocks:
- heading: 표지
  id: b1
  text: 'PowerBase 전산서비스 추가 업무 이용 계약서

    ([추가업무명])

    [표지 작성연월일]

    [갑 회사명]

    주식회사 코스콤

    PowerBase 전산서비스 추가 업무 이용 계약'
- heading: 제 1 조【목적】
  id: b2
  text: '[갑 회사명](이하 “갑”이라 한다)와 주식회사 코스콤(이하 “을”이라 한다)은 “갑”과 “을”이 [기본계약 체결일]자로 체결한 “PowerBase 전산서비스 이용계약”(이하 “기본계약” 이라 한다)의 추가 계약으로서, “갑”이 “을”의 PowerBase 전산서비스의 추가 업무를 이용하기 위하여 아래와 같이 계약(이하 “본 계약”이라 한다)을 체결한다.'
- heading: 제 2 조【서비스의 내용】
  id: b3
  text: 본 계약에 따라 “갑”이 이용하는 “을”의 PowerBase 전산서비스의 추가 업무는 “[추가업무명]”로 한다.
- heading: 제 3 조【서비스 이용료】
  id: b4
  text: '본 계약에 따라 “갑”은 PowerBase 전산서비스 이용료로 다음의 금액을 “을”에게 지급하여야 한다.

    (단위 : 천원/년, 부가세 별도)'
- heading: 제 4 조【계약기간】
  id: b5
  text: '① 계약기간 : [계약기간]

    ② 본 계약의 계약기간은 “기본계약”이 존속하는 동안 계속 존속한다. 따라서 계약기간 연장은 “기본계약”과 동일하게 계약기간 만료일 2개월 전까지 서면에 의한 별도의 의사 표시가 없으면 본 계약은 “기본계약”과 동일하게 자동적으로 1년씩 연장된다.'
- heading: 제 5 조 【기타사항】
  id: b6
  text: '① “갑”은 “을”에게 서면으로 계약해지의 의사를 통보함으로써 본 계약을 해지할 수 있다. 이 경우 해지의 효력은 “을”이 통보서를 수령한 날부터 1개월이 경과한 날부터 발생한다.

    ② 계약 만료일 이전에 계약 해지 시 잔여 이용료 전액을 해지 위약금으로 “갑”은 “을”에게 지급하여야 한다.

    ➂ 본 계약은 “기본계약”에 보충된다. 본 계약과 관련된 사항으로서 본 계약에 명시되지 아니한 사항에 대해서는 “기본계약”의 관련조항을 준용한다.'
- heading: 확약 및 작성 부수
  id: b7
  text: “갑”과 “을”은 계약상의 의무를 성실히 이행할 것을 확약하며 계약서 2부를 작성하여 날인하고 각각 1부씩 보관한다.
- heading: 계약 체결일 및 서명란
  id: b8
  text: '[계약 체결일]

    “갑” [갑 주소]

    [갑 회사명]

    대표이사 [갑 대표이사명] (인)

    “을”서울특별시 영등포구 여의나루로4길 21

    주식회사 코스콤

    대표이사 [을 대표이사명] (인)'
