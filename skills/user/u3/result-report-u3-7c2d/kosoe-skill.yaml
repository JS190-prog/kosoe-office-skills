rules:
- 본 계약은 기존 기본계약의 추가 계약이므로 제1조에 기본계약 명칭과 체결일을 반드시 적는다.
- 추가업무명은 표지, 제2조, 이용료 표의 업무구분에서 서로 일치시킨다.
- 이용료는 천원/년 단위, 부가세 별도로 적고, 항목별 금액과 합계가 일치해야 한다.
- '이용료 표의 비고에는 적용 구간(예: 고객 그룹 구분)을 적는다.'
- 계약기간은 기본계약 존속 기간에 연동되며, 제4조 ② 자동연장 문구는 기본계약과 동일하게 유지한다.
- 중도해지 시 잔여 이용료 전액을 위약금으로 지급한다는 조항(제5조 ②)은 임의로 바꾸지 않는다.
